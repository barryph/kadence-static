<!doctype html>
<!--
  Source template for the Open Graph / social preview card (1200x630).

  Rendered once into `public/og-image.png` by `scripts/generate-og-image.mjs`.
  It is not part of the Astro build; it exists so the committed image can be
  regenerated or edited without a design tool.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kadence — account deletion</title>
    <style>
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 600;
        src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 700;
        src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-700-normal.woff2')
          format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 76px 88px;
        background-color: #050711;
        color: #fff;
        font-family: 'IBM Plex Mono', monospace;
      }

      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            760px 520px at 4% -18%,
            rgba(8, 124, 255, 0.32),
            transparent 62%
          ),
          radial-gradient(
            620px 440px at 104% 6%,
            rgba(8, 216, 255, 0.16),
            transparent 60%
          ),
          radial-gradient(
            700px 560px at 50% 122%,
            rgba(0, 114, 255, 0.2),
            transparent 64%
          );
      }

      body::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(8, 216, 255, 0.7),
          transparent
        );
      }

      .content,
      .footer {
        position: relative;
      }

      .logo {
        height: 84px;
        width: auto;
        display: block;
        margin-left: -6px;
      }

      h1 {
        margin-top: 52px;
        font-size: 66px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
        max-width: 900px;
      }

      p {
        margin-top: 22px;
        font-size: 27px;
        line-height: 1.5;
        font-weight: 400;
        color: #c7ddf5;
        max-width: 920px;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 22px;
        font-weight: 500;
        color: #8fb6dd;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 10px 20px;
        border: 1px solid rgba(8, 216, 255, 0.4);
        border-radius: 999px;
        background: rgba(8, 124, 255, 0.16);
        color: #bfe4ff;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <img class="logo" src="kadence-logo.png" alt="Kadence" />
      <h1>Delete your Kadence account</h1>
      <p>Permanently delete your Kadence account and associated data.</p>
    </div>

    <div class="footer">
      <span class="badge">Official account page</span>
      <span>Account management &middot; Code Complete Labs</span>
    </div>
  </body>
</html>
