name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN scopes required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, but let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # The production URLs are committed here so a push to main deploys a
      # working site with no extra configuration. Repository variables
      # (Settings -> Secrets and variables -> Actions -> Variables) override
      # them, e.g. to build against a staging API.
      #
      # NOTE: the API and the site are deliberately on different origins.
      - name: Resolve build configuration
        env:
          VAR_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          VAR_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail

          api_base_url="${VAR_API_BASE_URL:-https://kadence.barryph.com}"
          site_url="${VAR_SITE_URL:-https://kadence.static.barryph.com}"

          {
            echo "PUBLIC_API_BASE_URL=${api_base_url}"
            echo "SITE_URL=${site_url}"
          } >> "$GITHUB_ENV"

          echo "PUBLIC_API_BASE_URL=${api_base_url}"
          echo "SITE_URL=${site_url}"

      - name: Build
        run: pnpm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
