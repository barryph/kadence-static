name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # Builds without an API URL so CI never depends on production config.
      # The failure mode (a clear "misconfigured" message) is covered by tests.
      - name: Build
        run: pnpm run build

      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/delete-account/index.html
          test -f dist/delete-account/confirm/index.html
          test -f dist/.nojekyll
